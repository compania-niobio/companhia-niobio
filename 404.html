<!doctype html>
<html lang="pt-BR" class="is-deep">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Página não encontrada | Niobio</title>
  <meta name="description" content="Esta página não existe ou mudou de endereço. Volte para o início do site da Niobio.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#04060c">
  <link rel="icon" href="/favicon.ico" sizes="any">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500..700&amp;family=Work+Sans:wght@400..600&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500..700&amp;family=Work+Sans:wght@400..600&amp;display=swap"></noscript>
  <link rel="stylesheet" href="/css/styles.css">

  <style>
    body { background: var(--black); }
    .lost {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 4rem var(--gutter);
      text-align: center;
    }
    .lost__inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 40rem;
    }
    .lost h1 {
      font-size: clamp(2.25rem, 1.6rem + 3.2vw, 4rem);
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: -0.04em;
      font-variation-settings: "opsz" 40;
    }
    .lost p {
      margin-top: 1.1rem;
      color: var(--ink-soft);
      max-width: 30rem;
    }
    .lost .btn { margin-top: 2rem; }
    /* Fio de luz que liga o botão ao globo aceso */
    .lost__wire {
      width: 2px;
      height: clamp(3rem, 8vh, 5.5rem);
      background: linear-gradient(to bottom, rgb(169 196 255 / 0.7), rgb(30 107 255 / 0.15));
      border-radius: 2px;
    }
    .lost__globe {
      position: relative;
      width: clamp(9rem, 22vw, 13rem);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
    }
    .lost__globe::before {
      content: "";
      position: absolute;
      inset: -40%;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgb(30 107 255 / 0.55), rgb(10 77 255 / 0.18) 55%, transparent 75%);
      z-index: -1;
      animation: glow 5s var(--ease-glass) infinite alternate;
    }
    .lost__globe img {
      width: 78%;
      height: 78%;
      object-fit: cover;
      aspect-ratio: 1;
      filter: drop-shadow(0 0 22px rgb(141 180 255 / 0.55));
    }
    @keyframes glow {
      from { opacity: 0.7; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1.04); }
    }
    @media (prefers-reduced-motion: reduce) {
      .lost__globe::before { animation: none; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
        <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="38" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    </defs>
  </svg>

  <div class="backdrop" aria-hidden="true">
    <img src="/assets/fundador/fundo-azul-1200.webp"
         srcset="/assets/fundador/fundo-azul-300.webp 300w, /assets/fundador/fundo-azul-600.webp 600w, /assets/fundador/fundo-azul-1200.webp 1200w"
         sizes="100vw" width="1200" height="670" alt="" decoding="async">
  </div>

  <main class="lost">
    <div class="lost__inner">
      <h1>Esta página saiu do mapa</h1>
      <p>O endereço que você abriu não existe ou mudou de lugar. Acontece. O caminho de volta está logo abaixo.</p>
      <a class="btn glass glass--refract" href="/">
        Voltar para o início
        <span class="btn__icon" aria-hidden="true"><svg><use href="#i-back"/></svg></span>
      </a>
      <span class="lost__wire" aria-hidden="true"></span>
      <div class="lost__globe" aria-hidden="true">
        <img src="/assets/logo/logo-niobio-300.webp"
             srcset="/assets/logo/logo-niobio-300.webp 300w, /assets/logo/logo-niobio-600.webp 600w"
             sizes="13rem" width="300" height="169" alt="" decoding="async">
      </div>
    </div>
  </main>

  <script>
    (function () {
      var b = (navigator.userAgentData && navigator.userAgentData.brands) || [];
      if (b.some(function (x) { return /Chromium/.test(x.brand); })) document.documentElement.classList.add('has-refraction');
    })();
  </script>
</body>
</html>
